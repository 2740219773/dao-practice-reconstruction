# TOPIC-0XX【专题名】专题清单（manifest）
# 本文件是专题的单一专题清单：专题网页、证据检查、发布审核与统计都读取本文件，
# 不在多个文档中人工重复维护编号。修改需经项目负责人确认（同工作包范围卡）。
#
# 使用说明：复制到 11-专题研究/TOPIC-0XX-【专题名】/manifest.yml 后填写；
# 占位符【】内为待填内容；结论编号（C0X）只在证据总账维护，本文件仅登记。

专题编号: TOPIC-0XX
专题名称: 【专题名】
专题类型: 概念型
模块: 概念与思想研究
当前阶段: 阶段0-范围冻结        # 阶段0-范围冻结／阶段1-来源核对／阶段2-证据总账／阶段3-概念主张争议／阶段4-现代研究核对／阶段5-风险边界／阶段6-结论摘要与用户入口／阶段7-反向审查／阶段8-发布验收／已冻结
当前状态: 待开始                # 状态机：待开始→进行中→待用户验收→已完成→已归档（阶段验收通过后：已完成并冻结）
激活日期: YYYY-MM-DD
工作包范围卡: 00-项目规范/工作包/TOPIC-0XX-【专题名】全链路样板.md

# 核心问题：阶段0 冻结后不再增减（停止条件：核心问题≤4）
核心问题:
  - id: Q1
    question: 【问题一】
  - id: Q2
    question: 【问题二】

# 核心文献范围（阶段0 冻结）
核心原文:
  - 【原文编号，如 原文-0001】
补充文献范围:                    # 可选：仅辅助核对，不进入核心清单
  - 【原文/文献编号】
核心概念:
  - 【概念编号】
核心主张:
  - 【主张编号】
核心争议:
  - 【争议编号】

# 现代研究范围（固定清单；只作限定/反限，不用于直接证明传统机制）
现代研究范围:
  - 【现代研究编号】
补充现代研究:                    # 可选
  - 【编号】
风险资料:
  - 【风险资料编号】

# 明确排除范围（阶段0 停止条件：排除范围明确；阶段进行中不得随意扩展）
明确排除范围:
  - 【不研究的内容，如：实践教程／相邻概念的完整概念史／新增大批现代论文／重构网站】

# 核心结论编号（阶段2 起维护；结论只在证据总账维护，此处仅登记引用）
核心结论编号:
  - TOPIC-0XX-C01
  - TOPIC-0XX-C02

安全分类: A类                    # A 纯知识研究／B 自然状态观察／C 主动身心干预／D 高风险（《安全边界 V0.2》§3）
公开状态: 可公开草稿              # 不公开／内部预览／可公开草稿／正式公开（来源/底本复核完成前维持草稿）

关联模块:                        # 仅导航引用，不建立内容接口、不提前写结论
