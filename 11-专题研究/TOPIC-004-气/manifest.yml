阶段4研究材料:
  - R01 王弼《老子道德经注》第10章（专=任；任自然之气）
  - R02 河上公《老子河上公章句》第10章（专守精气使不乱）
  - R03 刘绩《管子补注》卷16（不可止以力、气自调理、精气层次、搏/专线索）
  - R04 郭象、成玄英心斋注疏（复用TOPIC-002，只处理心斋之气）
  - R05 陈志雄《〈管子〉四篇道气关系论辨正》（现代人文学术反限）

最终结论:
  C01: 冻结材料中的气按多种文本角色整理，不追求单一实体定义
  C02: 不直接等同呼吸、空气、氧气、物理能量、能量场或主观气感
  C03: 当前不支持心控制气/以意领气统一模型
  C04: 专气、听之以气、气理、善恶气、搏气、精气、血气等逐文本处理；专气与搏气解释竞争保留
  C05: 内业精—气关系只在该文本内部有限成立，不反读后世内丹体系

安全分类: A类
阶段5处理结果:
  - 不提供专气、搏气、聚气、守气、行气、导气教程
  - 不提供以意领气、意守位置、气感追踪或强化
  - 不提供调息、吐纳、屏息、憋气或呼吸节拍
  - 不用麻热胀流动感验证经典“气”
  - 不把气直接等同呼吸、氧气、能量场或生物电
  - 姿势、饮食、睡眠等无关风险不机械扩入

