阶段4研究材料:
  - R01 王弼《老子道德经注》第10章（专=任；任自然之气）
  - R02 河上公《老子河上公章句》第10章（专守精气使不乱）
  - R03 刘绩《管子补注》卷16（不可止以力、气自调理、精气层次、搏/专线索）
  - R04 郭象、成玄英心斋注疏（复用TOPIC-002，只处理心斋之气）
  - R05 陈志雄《〈管子〉四篇道气关系论辨正》（现代人文学术反限）

阶段4处理结果:
  C01: 多角色框架保持；注释史与现代学术进一步证明不能轻率单一化
  C02: 未发现任何材料支持气=呼吸/氧气/能量/气感直接等号
  C03: 王弼“任”、刘绩“气自调理”、心斋注疏使心控气模型反限增强
  C04: 专气与搏气真实解释竞争确认，逐文本处理结论增强
  C05: 内业精—气局部关系保持；不反读后世内丹体系

安全分类: A类
风险资料:
  - 不新增专门风险资料卡；本专题用气专题安全边界记录真实相关误读

阶段5处理结果:
  - 不提供专气、搏气、聚气、守气、行气、导气教程
  - 不提供以意领气、意守位置、气感追踪或强化
  - 不提供调息、吐纳、屏息、憋气或呼吸节拍
  - 不用麻热胀流动感等体验验证经典“气”
  - 不把气直接等同呼吸、氧气、能量场或生物电
  - 姿势、饮食、睡眠等无关风险不机械扩入

明确排除范围:
  - 黄帝内经及中医脏腑、经络、营卫、宗气等完整医学气论
  - 秦汉以后完整宇宙论、玄学与理气论
  - 道教服气、行气、吐纳的完整历史与技术
  - 内丹“精气神”“先天炁/后天气”“炼精化气”等后世体系
  - 近现代气功“内气、外气、气感、发气”等体系
  - 把“气”直接等同空气、氧气、二氧化碳、生物电、神经冲动、物理能量或能量场
  - TOPIC-005“息”的完整呼吸概念与呼吸技术
  - TOPIC-006“身”的完整身体理论
  - “精、神、血”的完整独立概念史
  - 专气、听气、调气、导气、意守、吐纳、屏息等实践教程
  - 个人气感、内证或异常体验解释
  - 大规模增加跨时代文献和现代论文
  - website/、搜索、构建、部署等平台轨工作

