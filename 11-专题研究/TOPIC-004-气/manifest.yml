核心问题:
  - id: Q1
    question: 在本专题冻结材料中，“气”主要承担哪些不同文本角色，能否用单一定义概括？
  - id: Q2
    question: 传统文本中的“气”能否直接等同于呼吸、空气、氧气、能量或主观“气感”？
  - id: Q3
    question: “气”与“心、静”的关系如何表达，能否简单理解为“心控制气”或“意念调气”？
  - id: Q4
    question: “专气、听之以气、气理、精气、血气、善气/恶气”等表述，是同一种“气”还是不同文本语境中的不同用法？

