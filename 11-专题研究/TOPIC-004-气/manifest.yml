核心结论源: 11-专题研究/TOPIC-004-气/证据总账.md

批次一结论:
  C01: 冻结材料中的气按多种文本角色整理，不先统一为单一实体定义
  C02: 不直接等同呼吸、空气、氧气、物理能量、能量场或主观气感
  C03: 当前不支持心控制气/以意领气统一模型，继承并补强TOPIC-003-C03边界
  C04: 专气、听之以气、气理、善恶气、搏气、精气、血气等逐文本处理，不先合并同一机制
  C05: 内业“精也者，气之精者也”只支持该文本内部精气关系，不反读后世内丹精气神体系

研究材料范围:
  传统注疏与训诂:
    - 阶段3/4只处理Q1-Q4直接需要的王弼、《庄子》注疏、《管子》校注与相关训诂
  现代人文学术:
    - 只处理冻结文本中的气语义、精气关系、心气关系及解释竞争
  现代实证研究:
    - 默认不进入核心结论；只在阶段4澄清现代对应边界时按需使用
  传播性材料:
    - 只在出现具体可追溯的“气=能量/气感证明”等现代说法时使用

风险资料:
  - 按阶段5真实误读生成；批次一不预设练习风险材料

明确排除范围:
  - 黄帝内经及中医脏腑、经络、营卫、宗气等完整医学气论
  - 秦汉以后完整宇宙论、玄学与理气论
  - 道教服气、行气、吐纳的完整历史与技术
  - 内丹“精气神”“先天炁/后天气”“炼精化气”等后世体系
  - 近现代气功“内气、外气、气感、发气”等体系
  - 把“气”直接等同空气、氧气、二氧化碳、生物电、神经冲动、物理能量或所谓能量场
  - TOPIC-005“息”的完整呼吸概念与呼吸技术；本专题只建立“气不能直接等同息”的边界
  - TOPIC-006“身”的完整身体理论
  - “精、神、血”的完整独立概念史
  - 专气、听气、调气、导气、意守、吐纳、屏息等实践教程
  - 个人气感、内证或异常体验解释
  - 大规模增加跨时代文献和现代论文
  - website/、搜索、构建、部署等平台轨工作

