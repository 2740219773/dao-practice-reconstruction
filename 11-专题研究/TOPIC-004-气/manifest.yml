核心问题:
  - id: Q1
    question: 在本专题冻结材料中，“气”主要承担哪些不同文本角色，能否用单一定义概括？
  - id: Q2
    question: 传统文本中的“气”能否直接等同于呼吸、空气、氧气、能量或主观“气感”？
  - id: Q3
    question: “气”与“心、静”的关系如何表达，能否简单理解为“心控制气”或“意念调气”？
  - id: Q4
    question: “专气、听之以气、气理、精气、血气、善气/恶气”等表述，是同一种“气”还是不同文本语境中的不同用法？

核心文献:
  - 道德经
  - 庄子
  - 管子·内业

核心原文:
  - 原文-0002（道德经·10章：专气致柔）
  - 原文-0004（道德经·55章：心使气曰强）
  - 原文-0005（庄子·人间世·心斋：听之以气、气也者虚而待物者也）
  - 原文-0007（管子·内业：凡物之精、此气也、不可止以力而可安以德）
  - 原文-0009（管子·内业：心静气理，道乃可止）
  - 原文-0010（管子·内业：精也者，气之精者也）
  - 原文-0011（管子·内业：善气/恶气、搏气、精气之极、血气既静）

关键补充证据:
  - 无（阶段0不预设；后续只有直接影响Q1-Q4且不宜扩入核心范围的材料才登记）

补充文献范围:
  - TOPIC-001“静”、TOPIC-003“心”（已冻结，只作关系回读）
  - 原文-0012（管子·内业相关段；阶段1仅判断是否必要，不自动升级核心）
  - 坐忘论（不列核心；若仅有零星“气”字，只作历史层次背景）

核心概念:
  - 概念-0004（气；现有旧稿，阶段3按证据总账整体重构）

核心主张:
  - 无（不预先制造“气=能量”“气=呼吸”“气可由意念控制”等主张卡）
核心争议:
  - 无（阶段3按真实解释竞争建立）
核心假说:
  - 无

研究材料范围:
  传统注疏与训诂:
    - 只处理Q1-Q4直接需要的王弼、《庄子》注疏、《管子》校注与相关训诂
  现代人文学术:
    - 只处理冻结文本中的“气”语义、精气关系、心气关系及解释竞争
  现代实证研究:
    - 默认不进入核心结论；只在阶段4澄清现代对应边界时按需使用
  传播性材料:
    - 只在出现具体可追溯的“气=能量/气感证明”等现代说法时使用

风险资料:
  - 按阶段5真实误读生成；阶段0不预设练习风险材料

明确排除范围:
  - 黄帝内经及中医脏腑、经络、营卫、宗气等完整医学气论
  - 秦汉以后完整宇宙论、玄学与理气论
  - 道教服气、行气、吐纳的完整历史与技术
  - 内丹“精气神”“先天炁/后天气”“炼精化气”等后世体系
  - 近现代气功“内气、外气、气感、发气”等体系
  - 把“气”直接等同空气、氧气、二氧化碳、生物电、神经冲动、物理能量或所谓能量场
  - TOPIC-005“息”的完整呼吸概念与呼吸技术；本专题只建立“气≠可直接等同息”的边界
  - TOPIC-006“身”的完整身体理论
  - “精、神、血”的完整独立概念史；只在核心文本需要时最小引用
  - 专气、听气、调气、导气、意守、吐纳、屏息等实践教程
  - 个人气感、内证或异常体验解释
  - 大规模增加跨时代文献和现代论文
  - website/、搜索、构建、部署等平台轨工作

核心结论编号:
  - 待阶段2建立（不预先固定数量）

