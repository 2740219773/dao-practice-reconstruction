明确排除范围:
  - 黄帝内经及中医完整气论
  - 服气、行气、吐纳、导引的完整历史与技术
  - 内丹精气神、炼精化气、先天炁/后天气等后世体系
  - 近现代气功内气、外气、发气、气感体系
  - 把气直接等同空气、氧气、二氧化碳、生物电、神经冲动、物理能量或能量场
  - TOPIC-005息的完整定义、呼吸史与呼吸技术
  - TOPIC-006身的完整身体理论
  - 精、神、血的完整独立概念史
  - 专气、听气、调气、导气、意守、吐纳、屏息等实践教程
  - 个人气感、内证或异常体验解释
  - 大规模跨时代文献/论文扩张
  - website/及平台轨工作

