# 核心问题：阶段0冻结，第一轮只回答以下4个问题
核心问题:
  - id: Q1
    question: 在本专题冻结材料中，“心”主要承担哪些不同角色，能否用单一定义概括？
  - id: Q2
    question: “心”与已经完成的“静、虚”分别是什么关系？
  - id: Q3
    question: “心”与“气”的关系在《道德经》《管子·内业》中如何表达，能否简单理解为“心控制气”？
  - id: Q4
    question: “虚心、心斋、一志、定心、收心”等表述，是同一种方法，还是不同文本中的不同语境？

# 第一轮继续使用与“静/虚”可比较的四部文献，不新增《黄帝内经》等体系
核心文献:
  - 道德经
  - 庄子
  - 管子·内业
  - 坐忘论

# 只纳入直接出现“心”并直接服务Q1-Q4的现有原文卡
核心原文:
  - 原文-0004（道德经·55章：心使气曰强）
  - 原文-0005（庄子·人间世·心斋：听之以心、心止于符、唯道集虚）
  - 原文-0008（管子·内业：凡心之形/自充自盈等）
  - 原文-0009（管子·内业：心静气理，道乃可止）
  - 原文-0010（管子·内业：定心在中、心以藏心、心全于中）
  - 原文-0016（坐忘论·收心：一身之主、收心离境、虚心/安心）
  - 原文-0019（道德经·3章：虚其心，实其腹）

关键补充证据:
  - 无（阶段0不预设；阶段1后若出现直接支撑核心判断但不宜扩入核心范围的材料，再显式登记）

补充文献范围:
  - 原文-0006（庄子·大宗师·坐忘；只作“心/知/忘”关联背景）
  - 原文-0011、原文-0012（管子·内业相关段；阶段1先核对是否值得进入核心）
  - 原文-0018（坐忘论·泰定；只作后世“心—定—慧”比较）
  - 原文-0023（管子·心术上“虚其欲，神将入舍”；只作心斋/内业邻近比较，不直接定义“心”）
  - 概念-0001（静）、概念-0002（虚；已冻结，作为上游关系核对对象）

核心概念:
  - 概念-0003（心；现有旧稿，阶段3按证据总账重构）

核心主张:
  - 无（按来源生成，不预先制造“心=脑/心脏”“心控制气”等主张卡）
核心争议:
  - 无（阶段3按真实解释竞争建立）
核心假说:
  - 无

研究材料范围:
  传统注疏与训诂:
    - 只核对Q1-Q4直接需要的王弼、郭象/成玄英、《管子》校注、《坐忘论》相关注释
  现代人文学术:
    - 只处理“心”在冻结文本中的语义、心气关系、心斋/收心解释史
  现代实证研究:
    - 默认不进入核心结论；仅在阶段4需要澄清“心≠现代脑科学单一概念”等边界时按需使用
  传播性材料:
    - 只在发现具体、可追溯的现代误读时建立

风险资料:
  - 风险资料-0001（仅用于“收心/一志=强制压制念头”等误读边界）

明确排除范围:
  - 《黄帝内经》“心为君主之官”等医学心脏/脏象体系（另立医学或后续专题，不进入本轮）
  - 儒家《孟子》《荀子》等完整心性论与“尽心/养心/心性善恶”专题
  - 佛教心、识、心性、禅宗无心等完整概念史
  - 宋明理学/心学“人心道心、心即理”等体系
  - 内丹“心肾、性命、真心妄心”等后世体系
  - “神、志、意、情、知、识”的完整独立概念史；只在解释核心文本时最小引用
  - “气、息、身”的完整理论；心—气只回答Q3，不提前启动TOPIC-004/005/006
  - 把传统“心”直接等同于解剖心脏、大脑、意识、注意力、执行功能等现代单一概念
  - 心斋、收心、守一、定心等实践教程与个性化练习指导
  - 个人内证、神秘体验、异常体验解释
  - 大规模增加论文或跨时代材料
  - website/、搜索、构建、部署等平台轨工作

核心结论编号:
  - 待阶段2建立（不预先固定数量）

