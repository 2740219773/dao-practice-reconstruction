阶段4研究材料:
  - R01 王弼《老子道德经注》55章（心宜无有，使气则强）
  - R02 刘绩《管子补注》卷16（刑=法；静心则气自调理）
  - R03 中国哲学书电子化计划《管子·内业》多底本页（网络文本核对）
  - R04 现代《管子》心论研究（心中之心/刑形解释竞争）
  - R05 郭象、成玄英心斋注疏（复用TOPIC-002）
  - R06 TOPIC-002现代心斋解释竞争材料（只作反限）

阶段4处理结果:
  C01: 多角色框架保持；“刑/形”“心中之心”明确为解释竞争，不实体化
  C02: 心与静/虚继续逐文本处理，不建立固定三段流程
  C03: 王弼与刘绩注释层进一步加强对“心控制气/以意领气”简化模型的反限
  C04: 心斋/定心/收心保持历史分层，不合并统一方法
  C05: 不建立心=心脏/大脑/意识/注意力等现代单一等式

安全分类: A类
风险资料:
  - 风险资料-0001（仅用于强制压念误读边界）
阶段5处理结果:
  - 不提供心斋、定心、收心操作教程
  - 不提供压念、止念、无念或“清空大脑”训练
  - 不提供以意领气、意念控气、调息导气方法
  - 不把心静气理改写成固定调息流程
  - 呼吸、姿势、身体内部关注等无关风险明确为不适用

