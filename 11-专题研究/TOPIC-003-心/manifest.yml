核心问题:
  - id: Q1
    question: 在本专题冻结材料中，“心”主要承担哪些不同角色，能否用单一定义概括？
  - id: Q2
    question: “心”与已经完成的“静、虚”分别是什么关系？
  - id: Q3
    question: “心”与“气”的关系在《道德经》《管子·内业》中如何表达，能否简单理解为“心控制气”？
  - id: Q4
    question: “虚心、心斋、一志、定心、收心”等表述，是同一种方法，还是不同文本中的不同语境？

核心文献:
  - 道德经
  - 庄子
  - 管子·内业
  - 坐忘论

核心原文:
  - 原文-0004（道德经·55章：心使气曰强）
  - 原文-0005（庄子·人间世·心斋：听之以心、心止于符、唯道集虚）
  - 原文-0008（管子·内业：凡心之刑/形、自充自盈等；刑/形待纸本校勘）
  - 原文-0009（管子·内业：心静气理，道乃可止）
  - 原文-0010（管子·内业：定心在中、心以藏心、心全于中）
  - 原文-0016（坐忘论·收心：一身之主、收心离境、虚心/安心）
  - 原文-0019（道德经·3章：虚其心，实其腹）

关键补充证据:
  - 无（批次一未发现必须突破冻结范围的直接证据缺口）

