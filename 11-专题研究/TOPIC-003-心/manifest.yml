  - 原文-0018（坐忘论·泰定；后世“心—定—慧”比较）
  - 原文-0023（管子·心术上“虚其欲，神将入舍”；邻近比较）
  - 概念-0001（静）、概念-0002（虚；已冻结上游关系核对对象）

