核心问题:
  - id: Q1
    question: 在本专题冻结材料中，“心”主要承担哪些不同角色，能否用单一定义概括？
  - id: Q2
    question: “心”与已经完成的“静、虚”分别是什么关系？
  - id: Q3
    question: “心”与“气”的关系在《道德经》《管子·内业》中如何表达，能否简单理解为“心控制气”？
  - id: Q4
    question: “虚心、心斋、一志、定心、收心”等表述，是同一种方法，还是不同文本中的不同语境？

