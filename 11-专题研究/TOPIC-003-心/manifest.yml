  - 无（阶段3按真实解释竞争决定；“心以藏心”是潜在争议点）
核心假说:
  - 无

研究材料范围:
  传统注疏与训诂:
    - 王弼55章“心使气曰强”
    - 郭象/成玄英心斋注疏
    - 《管子》“刑/形”“心以藏心”等校注
    - 《坐忘论》收心段版本与解释
  现代人文学术:
    - 只处理冻结文本中的“心”语义、心气关系、心斋/收心解释史
  现代实证研究:
    - 默认不进入核心结论；只在现代对应边界需要时按需使用
  传播性材料:
    - 只在发现具体可追溯误读来源时建立

风险资料:
  - 风险资料-0001（只用于“收心/一志=强制压制念头”等误读边界）

明确排除范围:
  - 《黄帝内经》医学心脏/脏象体系
  - 儒家《孟子》《荀子》等完整心性论
  - 佛教心/识/心性/禅宗无心完整概念史
  - 宋明理学/心学
  - 内丹心肾、真心妄心、性命等体系
  - 神、志、意、情、知、识的完整独立概念史
  - 气、息、身完整理论；心—气只回答Q3
  - 把传统“心”直接等同解剖心脏、大脑、意识、注意力、执行功能等现代单一概念
  - 心斋、收心、守一、定心等实践教程
  - 个人内证、神秘体验、异常体验解释
  - 大规模增加论文或跨时代材料
  - website/、搜索、构建、部署等平台轨工作

