明确排除范围:
  - 数息、调息、听息、胎息、龟息等完整历史与技术
  - 道教吐纳、服气、行气、导引体系
  - 佛教安那般那、数息观等完整禅修体系
  - 黄帝内经呼吸、脉息、营卫等完整医学体系
  - 内丹呼吸、胎息、真息等后世体系
  - 现代腹式呼吸、膈肌呼吸、呼吸频率、HRV等训练体系
  - 把息以踵直接等同脚跟呼吸、丹田呼吸、腹式呼吸或某种现代生理机制
  - 把息乱解释成调呼吸、停呼吸或屏息
  - 固定吸呼比、屏息、憋气、过度换气等操作教程
  - 个人呼吸体验、气感与内证解释
  - TOPIC-006身的完整理论
  - website/及平台轨工作

