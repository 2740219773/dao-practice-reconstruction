核心问题:
  - id: Q1
    question: 在冻结材料中，“息”至少有哪些直接文本用法？呼吸义与止息/平息义能否用单一定义概括？
  - id: Q2
    question: 《庄子》“真人之息以踵，众人之息以喉”是在描述什么？能否直接理解成脚跟呼吸、腹式呼吸、丹田呼吸或某种固定调息法？
  - id: Q3
    question: “息”与TOPIC-004已经研究的“气”是什么关系？能否直接写成“息=气=呼吸”？
  - id: Q4
    question: “息乱”与数息、调息、听息、胎息等后世表述能否因为同有“息”字就视为同一种方法？

核心文献:
  - 庄子·大宗师
  - 坐忘论·收心

核心原文:
  - 原文-0024（庄子·大宗师：其息深深；真人之息以踵，众人之息以喉）
  - 原文-0016（坐忘论·收心：息乱而不灭照，守静而不著空）

关键补充证据:
  - 阶段0无；只有出现直接影响Q1-Q4且不宜扩入核心的新材料时才登记

