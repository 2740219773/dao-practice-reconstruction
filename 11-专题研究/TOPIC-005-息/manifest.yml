核心结论源: 11-专题研究/TOPIC-005-息/证据总账.md

批次一结论:
  C01: 息在冻结材料中至少有呼吸名词义与止息/平息动词义，不能统一成“呼吸训练”
  C02: 息以踵支持真人/众人呼吸描写的对比，但不直接支持脚跟呼吸、腹式呼吸、丹田呼吸、胎息或固定现代机制
  C03: 当前不支持息=气=呼吸直接等式；继承TOPIC-004气息边界
  C04: 坐忘论“息乱”首先按平息纷乱处理，不是调息、停息或屏息
  C05: 当前核心原文不足以证明数息、调息、听息、胎息与息以踵/息乱属于同一方法或直接历史传承

明确排除范围:
  - 数息、调息、听息、胎息、龟息等完整历史与技术
  - 道教吐纳、服气、行气、导引体系
  - 佛教安那般那、数息观等完整禅修体系
  - 黄帝内经呼吸、脉息、营卫等完整医学体系
  - 内丹呼吸、胎息、真息等后世体系
  - 现代腹式呼吸、膈肌呼吸、呼吸频率、HRV等训练体系
  - 把息以踵直接等同脚跟呼吸、丹田呼吸、腹式呼吸或现代生理机制
  - 把息乱解释成调呼吸、停呼吸或屏息
  - 固定吸呼比、屏息、憋气、过度换气等操作教程
  - 个人呼吸体验、气感与内证解释
  - TOPIC-006身的完整理论
  - website/及平台轨工作

