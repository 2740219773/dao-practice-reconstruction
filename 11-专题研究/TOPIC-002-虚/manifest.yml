# 核心问题：阶段0 冻结后不再增减（停止条件：核心问题≤4）
核心问题:
  - id: Q1
    question: 道家文献中的"虚"主要是什么意思？
  - id: Q2
    question: '"虚"是否等于什么都没有？'
  - id: Q3
    question: '"致虚"是方法、过程还是结果？'
  - id: Q4
    question: '"虚"与"静、无、空"有什么区别？'

