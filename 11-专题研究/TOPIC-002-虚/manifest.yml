阶段4研究资料:
  - R01 王弼《老子道德经注》16章（虚/静分注与“虚静”合称）
  - R02 朱谦之《老子道德经校释》（45章“冲/盅—器虚”训诂）
  - R03 郭象注、成玄英疏《庄子·人间世》心斋段（若一志/虚而待物/唯道集虚）
  - R04 Machek 2016（现代人文解释候选；不证明古义）
  - R05 Li 2025（现代心斋解释竞争；作反限）
  - R06 张彩拢2010（摘要级；庄子坐忘与司马承祯坐忘论历史分层方向性材料）
阶段4研究表: 11-专题研究/TOPIC-002-虚/研究引用核对表.md

阶段4处理结果:
  C04: 王弼注显示虚静既可分说又合称；项目“虚偏清除/容纳、静偏安定/少扰”继续保持工作性辨析框架，不升级为古代统一定义
  C05: 45章“冲”已获得“盅/器虚”训诂依据，但只限具体语境；“无”保持独立文本边界；“空”不展开完整佛教概念史
  C06: 郭象/成玄英注疏支持“若一志”去异端/志趋一及虚心道集等解释；可限制“意识空白/压掉所有念头”的误读，但不映射为已证明的现代心理机制

