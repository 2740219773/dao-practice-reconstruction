name: cleanup-merged-branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-merged-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 删除已合并分支
        run: |
          set -euo pipefail
          branches=(
            "agent/topic-002-batch1-review"
            "agent/topic-003-heart-stage0"
            "agent/topic-004-qi-stage0"
            "agent/topic-005-breath-stage0"
            "integration/topic-005-merge"
          )
          for branch in "${branches[@]}"; do
            echo "Deleting $branch"
            git push origin --delete "$branch"
          done
