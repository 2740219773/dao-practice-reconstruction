name: website-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.node-version
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 知识图谱一致性检查
        run: npm run graph:check
      - name: 实践体系一致性检查
        run: npm run practice:check
      - name: 发布状态与实践场景回归测试
        run: npm test
      - name: 构建网站
        run: npm run build
      - name: Chromium实践工作台端到端回归
        run: npm run test:e2e:practice
      - name: 验证构建产物
        run: |
          test -f docs/.vitepress/dist/index.html
          test -f docs/.vitepress/dist/knowledge/index.html
          test -f docs/.vitepress/dist/graph/index.html
          test -f docs/.vitepress/dist/graph/node/concept.dao.html
          test -f docs/.vitepress/dist/graph/node/classic.baopuzi.html
          test -f docs/.vitepress/dist/graph/node/school.tianshi.html
          test -f docs/.vitepress/dist/question-map/index.html
          test -f docs/.vitepress/dist/topics/jing.html
          test -f docs/.vitepress/dist/method/index.html
          test -f docs/.vitepress/dist/safety/index.html
          # V2.x 实践入口与八张基础实践卡必须由仓库源文件自动生成
          test -f docs/.vitepress/dist/practice/index.html
          test -f docs/.vitepress/dist/practice/card/precheck.html
          test -f docs/.vitepress/dist/practice/card/posture.html
          test -f docs/.vitepress/dist/practice/card/contact-awareness.html
          test -f docs/.vitepress/dist/practice/card/natural-breath.html
          test -f docs/.vitepress/dist/practice/card/attention-return.html
          test -f docs/.vitepress/dist/practice/card/short-sitting.html
          test -f docs/.vitepress/dist/practice/card/movement-stillness.html
          test -f docs/.vitepress/dist/practice/card/daily-awareness.html
          # 条件标签页正文由 practice:check + node:test + Chromium E2E 校验
          grep -q "30天与阶段" docs/.vitepress/dist/practice/index.html
          grep -q "PRACTICE-003" docs/.vitepress/dist/practice/index.html
          # 实践详情必须展示机器生成的知识回链与“不等同”边界
          grep -q "关联与边界" docs/.vitepress/dist/practice/card/natural-breath.html
          grep -q "吐纳" docs/.vitepress/dist/practice/card/natural-breath.html
          grep -q "服气" docs/.vitepress/dist/practice/card/natural-breath.html
          grep -q "安全边界 V0.2" docs/.vitepress/dist/practice/card/natural-breath.html
          grep -q "导引" docs/.vitepress/dist/practice/card/movement-stillness.html
          # 旧统一知识详情页仍需保持兼容
          test -f docs/.vitepress/dist/knowledge/文献-0001-道德经.html
          test -f docs/.vitepress/dist/knowledge/原文-0001-道德经第十六章.html
          test -f docs/.vitepress/dist/knowledge/概念-0001-静.html
          test -f docs/.vitepress/dist/build-info.json
          # V3 图谱构建产物位于仓库根目录 data/
          test -f ../data/nodes.json
          test -f ../data/relations.json
          test -f ../data/graph.json
          test -f ../data/build-report.json
      - name: Cloudflare Pages线上部署验证
        if: ${{ github.event_name != 'pull_request' }}
        env:
          WDZ_SMOKE_BASE_URL: https://wendaozhi.pages.dev
          WDZ_EXPECT_COMMIT: ${{ github.sha }}
          WDZ_SMOKE_ATTEMPTS: 36
          WDZ_SMOKE_RETRY_MS: 10000
        run: npm run smoke
      - name: 上传网站构建产物
        uses: actions/upload-artifact@v4
        with:
          name: wendaozhi-dist
          path: website/docs/.vitepress/dist
          retention-days: 14
      - name: 上传知识图谱数据
        uses: actions/upload-artifact@v4
        with:
          name: wendaozhi-graph-data
          path: data
          retention-days: 14
