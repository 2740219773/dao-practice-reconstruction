notes:
  - related_to 为一般对称关系，文件只维护一条规范边。
  - 魏伯阳与《参同契》只使用 traditional_attribution，不升级为 authored。
  - 王重阳与全真道可使用 founded，但后世“五祖七真”谱系不得因此自动视为王重阳生前已固定。
  - 先秦道家、黄老属于 intellectual_tradition，不建立 founded 关系。
  - 丹道传统属于 practice_tradition，不建立单一创建者。
