migration_rules:
  - 新增节点、关系和来源一律使用 canonical_id。
  - aliases 仅用于兼容已有文件，不得继续作为新数据主 ID。
  - 同一别名若未来发现实际指向不同句段，必须拆分并记录迁移说明。
  - general 全书占位来源后续应逐步替换为具体篇章或句段。
  - 学术研究来源用于文本史、作者归属、历史关系与研究争议，不能代替经典原文证明经典自身主张。
