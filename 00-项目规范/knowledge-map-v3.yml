# 已被新版知识卡引用，但当前尚无正式 V3 节点的对象。
# 构建器应将其标记为 planned，而不是误判为丢失或自动创建空节点。
planned_nodes:
  - id: research.medobs
    name: 身体观察研究
    type: research
    status: planned
    reason: MEDOBS-001 工作包仍处于项目负责人确认的冻结状态；冻结期只保留范围、模板和接口，不收集资料、不建立正式医学观察卡，待既定解锁条件满足后再正式接入。

