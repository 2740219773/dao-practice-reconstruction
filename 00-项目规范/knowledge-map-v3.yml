# 问道志知识图谱 V3
# 本文件是图谱构建清单，不重复维护节点正文。
# 字段名保留英文仅用于程序解析。

version: "3.7"
status: review
mode: manifest

principles:
  - Markdown 知识卡是节点内容主来源，不在本文件复制正文。
  - 关系数据由独立关系文件维护。
  - 来源 ID 由统一注册表管理。
  - 知识导航、历史发展、师承和实践步骤必须分开。
  - 旧 V2 在迁移期保留兼容，但不再作为新增关系的主来源。
  - 人物与作品必须区分确定作者关系和传统归属关系。
  - school 仅是兼容顶层类型，正式节点必须用 school_kind 区分思想传统、宗教宗派、宗教传统和修炼传统。
  - 目录位置不决定节点本体类型；legacy 节点经审计后可以从 stage 等旧目录迁移到更准确的 concept、research 等类型。
  - 冻结工作包允许保留 planned 节点，不为追求 planned 清零而绕过项目治理规则。

