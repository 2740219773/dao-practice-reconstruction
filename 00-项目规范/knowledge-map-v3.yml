source_registry:
  path: 31-知识图谱整合/来源标识注册表-v1.yml
  version: "1.4"
  status: review

schemas:
  knowledge_card: 31-知识图谱整合/知识卡数据模型.md
  relation_rules: 31-知识图谱整合/节点关系规范.md
  source_rules: 00-项目规范/知识图谱来源字段规范.md
  writing_template: 00-项目规范/知识卡模板.md

legacy_compatibility:
  knowledge_map_v2:
    path: 00-项目规范/knowledge-map-v2.yml
    status: legacy
    policy: 只用于迁移期兼容，不再作为新增关系主来源。

  legacy_concept_cards:
    path: 04-概念卡
    status: evidence_source
    policy: 暂作为详细研究与原文编号入口，完成来源迁移前不删除。

  legacy_nodes:
    paths:
      - 25-人物节点
      - 26-流派节点
      - 27-方法节点
      - 28-修行阶段
      - 29-修行路线图
    status: mixed
    policy: 只有进入 expected_ids 的节点才视为已完成 V3 迁移；目录中其他旧文件不得自动视为正式 V3 数据。精气神、性命双修的旧 stage 文件仅保留迁移说明，正式正文位于 23-核心概念网络。

build_targets:
  nodes:
    planned_output: data/nodes.json
    status: ready
  relations:
    planned_output: data/relations.json
    status: ready
  graph:
    planned_output: data/graph.json
    status: ready

quality_gates:
  - 所有正式节点 ID 必须唯一。
  - 所有关系 target/source 必须指向正式节点或 planned_nodes 中明确登记的待建节点。
  - source_refs 必须能在来源注册表或节点来源中解析。
  - verified 判断不得引用未核对来源作为唯一依据。
  - related_to 与 contrasts_with 作为对称关系只维护一条规范边。
  - develops 与 influences 必须有历史证据，不得由知识导航箭头自动生成。
  - authored 只用于较稳定作者关系；传统托名或复合文本优先使用 traditional_attribution。
  - founded 只用于有历史研究支持的组织/运动创建关系，不用于后起思想分类或跨时代修炼传统。
  - 所有正式 school 节点必须存在 school_kind。
  - intellectual_tradition 不得自动拥有创建者或成员组织关系。
  - practice_tradition 不得伪装成单一连续宗教组织。
  - 方法关系不得自动解释为实践步骤。
  - 概念组合或理论原则不得仅因处于旧“修行阶段”目录就自动建模为 stage。
  - 吐纳、服气、导引、静坐等方法不得因现代相似性被自动合并。
  - planned_nodes 不得被网站或 AI 当作已有正式正文节点展示。
  - 经典作者、成书年代和文本分层必须优先使用学术研究来源，不能只依据传统归属字段。
  - 涉及外丹、辟谷、服气、极端呼吸等有现实风险的历史方法不得输出可复现危险操作、剂量或替代医疗建议。
  - 冻结工作包不得因图谱建设而被自动激活。
